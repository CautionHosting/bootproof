[package]
name = "bootproof"
version = "0.1.0"
edition = "2024"

[features]
default = ["platform-aws"]
platform-aws = ["dep:aws-nitro-enclaves-nsm-api", "dep:serde_bytes"]

[dependencies]
bootproof-tpm = { path = "../bootproof-tpm", features = ["attest"] }
bootproof-sdk = { path = "../bootproof-sdk", features = ["nitro"] }
x509-parser = "0.18.0"
thiserror = "2.0.17"
aws-nitro-enclaves-nsm-api = { version = "0.4.0", optional = true }
serde_bytes = { version = "0.11.19", optional = true }
tracing = "0.1.44"
clap = { version = "4.5", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Wire + crypto
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
digest = "0.10"
rand = "0.9"
# OpenPGP verification in-process (replaces the gpg exec). The keyring we ship
# is a plain OpenPGP public-key packet stream, which rPGP reads directly.
pgp = "0.20"
num-bigint = "0.4"
num-traits = "0.2"
p256 = "0.13"
group = "0.13"
p384 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["hazmat"] }

# attest server
axum = "0.8"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower-service = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
time = "0.3"

# verify client
ureq = { version = "2", features = ["tls"] }

# /proc/config.gz decoding (no external gzip)
flate2 = "1"
