[package]
name = "bootproof"
version = "0.1.0"
edition = "2024"

[features]
default = ["platform-aws"]
platform-aws = ["dep:aws-nitro-enclaves-nsm-api", "dep:serde_bytes"]

[dependencies]
# `attest` = the NitroTPM NSM vendor command (raw, no tss2). `esys` = the
# StageX tss2 C stack, required by the dmext TPM gate (the d3c proven path:
# ESAPI CreatePrimary/Create/Load for the sealed data object; only ESAPI's
# policy construction is broken on the platform firmware, so the Unseal is
# issued raw). Enabling esys makes the production binary static-link the tss2
# archives (see the Containerfile `build` target, which owns the link line).
bootproof-tpm = { path = "../bootproof-tpm", features = ["attest", "esys"] }
bootproof-sdk = { path = "../bootproof-sdk", features = ["nitro"] }
x509-parser = "0.18.0"
thiserror = "2.0.17"
aws-nitro-enclaves-nsm-api = { version = "0.4.0", optional = true }
serde_bytes = { version = "0.11.19", optional = true }
tracing = "0.1.44"
clap = { version = "4.5", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Wire + crypto
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
digest = "0.10"
rand = "0.9"
# Pure-Rust LUKS1/LUKS2 reader (no cryptsetup): LUKS2 header parse, argon2id
# PBKDF, anti-forensic re-merge, keyslot AES-XTS decrypt -> master key.
# `forbid(unsafe)`, audited RustCrypto primitives, ships cryptsetup-oracle tests.
luks-core = "0.1.8"
# Linux device-mapper control (stratis): DM_CREATE_MAPPER / TABLE_LOAD /
# DEV_SUSPEND for the crypt target. Pure-Rust surface (devicemapper-sys = ABI
# structs); it pulls nix->libc internally for the struct-pointer ioctl — a
# later rewrite candidate, not something we should hand-roll.
devicemapper = "0.34.8"
# mount(2) for ext4. rustix over nix: the syscall wrapper stays out of libc in
# our own code (linux_raw backend), per the "rewrite libc-dependent crates"
# direction.
rustix = { version = "1.1", features = ["mount"] }
# OpenPGP verification in-process (replaces the gpg exec). The keyring we ship
# is a plain OpenPGP public-key packet stream, which rPGP reads directly.
pgp = "0.20"
# SEV-SNP attestation in-process (replaces the snpguest exec): request a fresh
# report from /dev/sev-guest, decode the typed report, chain the VLEK cert to
# the pinned ASVK/ARK, and verify the report signature. crypto_nossl keeps it
# pure Rust (p384 + sha2 + rsa + x509-cert, no OpenSSL, no snpguest).
sev = { version = "=8.0.0", default-features = false, features = ["snp", "crypto_nossl"] }
num-bigint = "0.4"
num-traits = "0.2"
p256 = "0.13"
group = "0.13"
p384 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["hazmat"] }

# attest server
axum = "0.8"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower-service = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
time = "0.3"

# verify client
ureq = { version = "2", features = ["tls"] }

# /proc/config.gz decoding (no external gzip)
flate2 = "1"
