<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>System Health</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark}
body{font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0e14;color:#d7dce5;margin:0;padding:24px}
h1{font-size:18px;margin:0 0 12px}
.verdict{display:inline-block;padding:2px 10px;border-radius:3px;font-weight:700;margin-left:8px}
.p{background:#0c3a20;color:#7df0b2}.n{background:#3a3010;color:#e8d48a}.f{background:#40121a;color:#ff9ba8}.s{background:#14293d;color:#9ccdf5}
table{border-collapse:collapse;margin:14px 0;width:100%}
td{padding:3px 10px 3px 0;vertical-align:top;border-bottom:1px solid #1b2230}
td.k{color:#8a93a5;white-space:nowrap;width:1%}
.why{color:#8a93a5}
.sec{margin-top:22px;color:#8a93a5;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:12px}
a{color:#6fb6ff}
.foot{margin-top:26px;color:#5a6375;font-size:12px}
</style>
</head>
<body>
<h1>System Health</h1>
<div id="app">Verifying…</div>
<p>Service worker: <span id="sw-len"></span> bytes, sha256 <span id="sw-sha"></span></p>
<a href="/verify.js.src">view verifier source</a>
<script>
// The page is a DUMB RENDERER: zero trust logic lives here. All verification
// happens in /verify.js (the service worker, whose bytes are baked into the
// server binary and whose SHA-256 is printed below and asserted against
// bootproof::system_health::SW_SHA256). The SW re-verifies on its own timer
// and posts each verdict here; innerHTML is only ever fed the SW's own
// render() output, which escapes every byte of the untrusted envelope.
navigator.serviceWorker && navigator.serviceWorker.addEventListener("message", function (e) {
  var d = e.data;
  if (!d || d.type !== "system-health" || !d.result) return;
  var r = d.result;
  var el = document.getElementById("app");
  if (el && r.html !== undefined) el.innerHTML = r.html;
  var len = document.getElementById("sw-len");
  var sha = document.getElementById("sw-sha");
  if (len && r.swLen != null) len.textContent = r.swLen;
  if (sha && r.swSha) sha.textContent = r.swSha;
});
navigator.serviceWorker && navigator.serviceWorker.register('/verify.js', {scope: '/'});
</script>
</body></html>
