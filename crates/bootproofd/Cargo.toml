[package]
name = "bootproofd"
version = "0.1.0"
edition = "2024"

[features]
default = ["platform-aws"]
platform-aws = ["dep:aws-nitro-enclaves-nsm-api", "dep:serde_bytes"]

[dependencies]
axum = { version = "0.8.8", features = ["macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

aws-nitro-enclaves-nsm-api = { version = "0.4.0", optional = true }
serde_bytes = { version = "0.11.19", optional = true }
base64 = "0.22.1"
