[package]
name = "bootproofd"
version = "0.1.0"
edition = "2024"

[dependencies]
# The library that owns the whole attest surface (TLS /health, /info,
# /attestation + the collect-UDS routing). This crate is only a thin CLI
# over it, so nothing below is used by the main binary except the runtime
# + logging + arg parsing.
bootproof = { version = "0.1.0", path = "../bootproof", default-features = false }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "net", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
# Integration test: a full TLS client that POSTs /attestation against
# `bootproof::attest::run` to prove the socket routing. Versions are
# pinned to what the bootproof lib already locks.
base64 = "0.22"
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
