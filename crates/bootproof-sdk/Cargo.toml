[package]
name = "bootproof-sdk"
version = "0.1.0"
edition = "2024"
LICENSE = "MIT"
publish = false

[features]
default = ["nitro"]
nitro = ["dep:webpki", "dep:x509-parser", "dep:ring", "dep:coset"]

[dependencies]
serde_cbor = "0.11.2"
thiserror = "2.0.17"
tracing = "0.1.44"

# Nitro Attestation
coset = { version = "0.4.0", optional = true }
ring = { version = "0.17.14", optional = true }
webpki = { version = "0.22.4", optional = true }
x509-parser = { version = "0.18.0", optional = true }

[dev-dependencies]
hex = "0.4.3"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
