[package]
name = "bootproof-tpm"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.17"
tracing = "0.1.44"
sha2 = "0.10"
hmac = "0.12"
digest = "0.10"
tss-esapi-sys = { version = "0.6.0", optional = true }
aws-nitro-enclaves-nsm-api = { version = "0.4.0", optional = true }
ciborium = { version = "0.2", optional = true }

[build-dependencies]
pkg-config = "0.3"

[features]
default = []
esys = ["dep:tss-esapi-sys"]
# NitroTPM attestation-document request: the AWS NSM vendor command
# (0x20000001) that returns the hypervisor-signed attestation document
# bound to a caller nonce. Hand-rolled over the raw device (no tss2),
# mirroring the aws/NitroTPM-Tools reference flow.
attest = ["dep:aws-nitro-enclaves-nsm-api", "dep:ciborium"]
